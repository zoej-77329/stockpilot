services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot_user
      POSTGRES_PASSWORD: stockpilot_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - stockpilot_pgdata:/var/lib/postgresql/data
    networks:
      - stockpilot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot_user -d stockpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      SECRET_KEY: local-only-change-before-deployment
      JWT_SECRET_KEY: local-jwt-only-change-before-deployment
      DATABASE_URL: postgresql://stockpilot_user:stockpilot_local_only@db:5432/stockpilot
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "flask --app wsgi db upgrade && gunicorn --bind 0.0.0.0:5000 wsgi:app"]
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - stockpilot-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - stockpilot-net
    restart: unless-stopped

networks:
  stockpilot-net:
    driver: bridge

volumes:
  stockpilot_pgdata:
    name: stockpilot_pgdata
